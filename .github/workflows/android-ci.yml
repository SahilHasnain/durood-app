name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_target:
        description: Select a debug APK, preview APK, or production Play Store release
        required: true
        default: debug-apk
        type: choice
        options:
          - debug-apk
          - preview
          - production
      increment_version_code:
        description: Increment Android versionCode before building
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  increment-versions:
    name: Increment Android versionCode
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.increment_version_code == true }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment versionCode and commit
        id: commit
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "VersionCode increments can only be committed from a branch, not $GITHUB_REF"
            exit 1
          fi
          # Expo owns versionCode. Bump it in app.config.* or app.json,
          # because android/ is generated by prebuild and would overwrite build.gradle.
          config_file=""
          for candidate in app.config.js app.config.ts app.config.mjs app.config.cjs app.json; do
            if [ -f "$candidate" ]; then
              config_file="$candidate"
              break
            fi
          done
          if [ -z "$config_file" ]; then
            echo "No app.config.* or app.json found, skipping versionCode increment"
            exit 0
          fi
          if CONFIG_FILE="$config_file" node << 'EOF'
          const fs = require('fs');

          const configFile = process.env.CONFIG_FILE;
          const original = fs.readFileSync(configFile, 'utf8');
          let nextVersionCode;

          if (configFile.endsWith('.json')) {
            const config = JSON.parse(original);
            const expo = config.expo || {};
            const android = expo.android || {};
            const current = Number(android.versionCode) || 0;
            nextVersionCode = current + 1;
            android.versionCode = nextVersionCode;
            expo.android = android;
            config.expo = expo;
            fs.writeFileSync(configFile, JSON.stringify(config, null, 2) + '\n');
          } else {
            const pattern = /(versionCode\s*:\s*)(\d+)/;
            const match = original.match(pattern);
            if (!match) {
              process.exit(3);
            }
            const current = parseInt(match[2], 10);
            nextVersionCode = current + 1;
            fs.writeFileSync(configFile, original.replace(pattern, '$1' + nextVersionCode));
          }

          console.log('Incremented versionCode in ' + configFile + ': ' + (nextVersionCode - 1) + ' -> ' + nextVersionCode);
          EOF
          then
            :
          else
            status=$?
            if [ "$status" -ne 3 ]; then
              exit "$status"
            fi
            echo "No versionCode found in $config_file, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$config_file"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: increment Android versionCode [skip ci]"
          git push origin "HEAD:$GITHUB_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-android:
    name: Android ${{ inputs.build_target || 'debug-apk' }}
    needs: [increment-versions]
    if: ${{ always() && (needs.increment-versions.result == 'success' || needs.increment-versions.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: ${{ inputs.build_target || 'debug-apk' }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.increment-versions.outputs.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby for Fastlane
        if: ${{ env.BUILD_TARGET == 'production' && true }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase for Android push when app config requires it
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if node -e 'process.exit(require("./app.json").expo?.android?.googleServicesFile ? 0 : 1)'; then
            : "${GOOGLE_SERVICES_JSON_BASE64:?Missing GOOGLE_SERVICES_JSON_BASE64 secret}"
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          fi

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Prepare production credentials
        if: ${{ env.BUILD_TARGET == 'production' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_BASE64: ${{ secrets.PLAY_STORE_JSON_BASE64 }}
        run: |
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          : "${PLAY_STORE_JSON_BASE64:?Missing PLAY_STORE_JSON_BASE64 secret}"
          printf '%s' "$PLAY_STORE_JSON_BASE64" | base64 --decode > /tmp/play-store-key.json
          keytool -list -keystore /tmp/release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Configure release signing
        if: ${{ env.BUILD_TARGET == 'production' }}
        env:
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_PROJECT_DIR: android
        run: node scripts/patch-android-release-signing.mjs

      - name: Build debug APK
        if: ${{ env.BUILD_TARGET == 'debug-apk' }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          artifact_path=$(find app/build/outputs/apk -type f -name '*development-debug.apk' -print -quit)
          artifact_path=${artifact_path:-$(find app/build/outputs/apk -type f -name '*-debug.apk' -print -quit)}
          artifact_path=${artifact_path:-$(find app/build/outputs/apk -type f -name 'app-debug.apk' -print -quit)}
          if [ -z "$artifact_path" ]; then
            echo "No debug APK was produced"
            exit 1
          fi
          echo "ARTIFACT_PATH=android/$artifact_path" >> "$GITHUB_ENV"

      - name: Build preview APK
        if: ${{ env.BUILD_TARGET == 'preview' }}
        run: |
          cd android
          chmod +x ./gradlew
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.store.type=JKS -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android

          artifact_path=$(find app/build/outputs/apk -type f -name '*preview-release.apk' -print -quit)
          artifact_path=${artifact_path:-$(find app/build/outputs/apk -type f -name '*-release.apk' -print -quit)}
          artifact_path=${artifact_path:-$(find app/build/outputs/apk -type f -name 'app-release.apk' -print -quit)}
          if [ -z "$artifact_path" ]; then
            echo "No preview APK was produced"
            exit 1
          fi
          echo "ARTIFACT_PATH=android/$artifact_path" >> "$GITHUB_ENV"

      - name: Build production App Bundle
        if: ${{ env.BUILD_TARGET == 'production' }}
        env:
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
          aab_path=$(find app/build/outputs/bundle -type f -name '*production-release.aab' -print -quit)
          aab_path=${aab_path:-$(find app/build/outputs/bundle -type f -name '*.aab' -print -quit)}
          if [ -z "$aab_path" ]; then
            echo "No production AAB was produced"
            exit 1
          fi
          echo "AAB_PATH=android/$aab_path" >> "$GITHUB_ENV"

      - name: Upload debug APK artifact
        if: ${{ env.BUILD_TARGET == 'debug-apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload preview APK artifact
        if: ${{ env.BUILD_TARGET == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk-${{ github.run_number }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload production AAB artifact
        if: ${{ env.BUILD_TARGET == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab-${{ github.run_number }}
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Deploy production bundle to Google Play
        if: ${{ env.BUILD_TARGET == 'production' }}
        env:
          SUPPLY_JSON_KEY: /tmp/play-store-key.json
          ANDROID_APPLICATION_ID: com.duroodepak
          ANDROID_PROJECT_DIR: android
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
          AAB_PATH: ${{ env.AAB_PATH }}
          # The workflow already built the AAB in the previous step, so Fastlane
          # must not try to run Gradle again (repo root has no gradlew).
          SKIP_ANDROID_BUILD: "true"
        run: |
          bundle install --gemfile Gemfile
          bundle exec fastlane android deploy
